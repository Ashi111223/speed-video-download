<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Video Download</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #061638, #0757a5, #06265d);
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(20, 70, 140, 0.72);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 22px;
      box-shadow: 0 16px 45px rgba(0,0,0,.25);
    }

    .bolt { font-size: 48px; }

    h1 { margin: 12px 0; font-size: 30px; }
    h1 span { color: #42e1dc; }

    .intro { line-height: 1.6; color: #e0edff; }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #c9d8ee;
      background: white;
      color: #17233c;
    }

    button {
      border: 0;
      color: #052746;
      background: #43e0d5;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #78f2e9; }
    button:disabled { opacity: .6; cursor: wait; }

    #status {
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .note { margin-top: 22px; font-size: 13px; color: #d9e7ff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="bolt">⚡</div>
    <h1>Speed <span>Video</span> Download</h1>
    <p class="intro">
      Paste a direct video or image URL to download your file.
    </p>

    <form id="downloadForm">
      <input
        id="mediaUrl"
        type="url"
        placeholder="Paste direct video or image URL..."
        aria-label="Direct video or image URL"
        required
      >

      <select id="fileType" aria-label="File type">
        <option value="auto">Detect file type automatically</option>
        <option value="video">Video</option>
        <option value="image">Image</option>
      </select>

      <button id="downloadBtn" type="submit">Download File</button>
    </form>

    <p id="status" role="status"></p>

    <p class="note">
      Use direct links to files you own or have permission to save.
      Some websites block downloads from other websites.
      Instagram and Facebook post links may not work here.
    </p>
  </main>

  <script>
    const form = document.getElementById("downloadForm");
    const urlInput = document.getElementById("mediaUrl");
    const fileType = document.getElementById("fileType");
    const statusBox = document.getElementById("status");
    const button = document.getElementById("downloadBtn");

    function safeFilename(value, fallback) {
      return value.replace(/[^a-z0-9._-]/gi, "_").slice(-100) || fallback;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      let url;
      try {
        url = new URL(urlInput.value.trim());
        if (!["http:", "https:"].includes(url.protocol)) {
          throw new Error("Invalid protocol");
        }
      } catch {
        statusBox.textContent = "Please enter a valid URL starting with https://";
        return;
      }

      const chosenType = fileType.value;
      const path = url.pathname;
      let extension = path.includes(".")
        ? path.split(".").pop().toLowerCase()
        : "";

      const imageExtensions = ["jpg", "jpeg", "png", "gif", "webp", "avif", "bmp"];
      const videoExtensions = ["mp4", "webm", "mov", "m4v", "ogv"];

      if (chosenType === "image" && extension && !imageExtensions.includes(extension)) {
        statusBox.textContent = "This URL does not look like a common image file link.";
        return;
      }

      if (chosenType === "video" && extension && !videoExtensions.includes(extension)) {
        statusBox.textContent = "This URL does not look like a common video file link.";
        return;
      }

      if (!extension || extension.length > 6) {
        extension = chosenType === "image" ? "jpg" :
                    chosenType === "video" ? "mp4" : "file";
      }

      const filename = safeFilename(
        decodeURIComponent(path.split("/").pop() || ""),
        "download." + extension
      );

      button.disabled = true;
      statusBox.textContent = "Trying to download your file...";

      try {
        const response = await fetch(url.href);
        if (!response.ok) throw new Error("Download unavailable");

        const blob = await response.blob();
        if (blob.type && blob.type.startsWith("text/html")) {
          throw new Error("This is a webpage, not a direct media file");
        }

        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = filename.includes(".") ? filename : filename + "." + extension;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);

        statusBox.textContent = "Download started. Check your Downloads folder.";
      } catch {
        statusBox.textContent =
          "The site blocked direct downloading, or this is not a direct file URL. " +
          "Opening the link in a new tab instead; use the site's own download option if available.";

        const link = document.createElement("a");
        link.href = url.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open media link";
        link.style.display = "inline-block";
        link.style.marginTop = "10px";
        link.style.color = "#ffffff";
        statusBox.appendChild(document.createElement("br"));
        statusBox.appendChild(link);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
